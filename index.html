<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<title>Soul Care</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ec;--card:rgba(255,255,255,.93);--ink:#2f4a3a;--mute:#6c8172;--line:#d6e2d8;--brand:#4b7a5c;--brand2:#e2ede4;--warn:#a8632a;--warnbg:#f8ecdf;--bad:#a24646;--badbg:#f6e3e3;--ok:#2f7a4d;--okbg:#e1f0e5;--info:#3d6f84;--infobg:#e2eef3}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(55% 35% at 0% 0%,rgba(110,180,140,.30),transparent 70%),radial-gradient(50% 30% at 100% 100%,rgba(110,180,140,.28),transparent 70%),radial-gradient(45% 25% at 0% 100%,rgba(160,210,180,.25),transparent 70%)}
#app{max-width:560px;margin:0 auto;padding:12px 16px 80px}
h1{font-size:24px;font-weight:500;margin:6px 0 2px}h2{font-size:19px;font-weight:500;margin:18px 0 8px}
h3{font-size:14px;font-weight:600;margin:2px 0 8px;color:var(--brand);text-transform:uppercase;letter-spacing:.08em}
p{margin:0 0 10px}
.sub{color:var(--mute);font-size:15px}
.hero{position:relative;margin:-12px -16px 6px;aspect-ratio:520/239;background-size:cover;background-position:center top}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(238,242,236,0) 45%,var(--bg) 100%)}
.hero .ttl{position:absolute;z-index:1;left:18px;bottom:12px;font-family:'Sacramento',cursive;font-size:52px;line-height:1;color:#3b6a4c;text-shadow:0 0 14px rgba(255,255,255,.95)}
.hero.sm{aspect-ratio:auto;height:118px}.hero.sm .ttl{font-size:42px;bottom:6px}
.lead{font-size:17px;margin:4px 0 12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .back{border:0;background:var(--card);border-radius:10px;padding:8px 12px;font:inherit;font-size:16px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(40,70,50,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.big{border:0;border-radius:16px;padding:16px 12px;background:var(--card);font:inherit;font-size:16px;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgba(40,70,50,.1);text-align:left;min-height:78px}
.big .i{display:block;font-size:22px;margin-bottom:4px}
.big.main{background:var(--brand);color:#fff}
.badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:11px;background:var(--bad);color:#fff;font-size:13px;text-align:center;margin-left:4px}
label{display:block;font-size:15px;color:var(--mute);margin:14px 0 5px}
input,select,textarea{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(75,122,92,.15)}
textarea{min-height:96px}
.row{display:flex;gap:10px}.row>*{flex:1}
@media(max-width:520px){.row{display:block}}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:600;font-family:inherit;background:var(--brand);color:#fff;margin-top:16px}
.btn.light{background:var(--brand2);color:var(--brand)}.btn.red{background:var(--badbg);color:var(--bad)}
.btn.small{display:inline-block;width:auto;padding:8px 12px;font-size:15px;margin:6px 6px 0 0}
.seg{display:flex;background:#e3e9e2;border-radius:12px;padding:3px;margin:6px 0}
.seg button{flex:1;border:0;background:transparent;padding:11px 4px;border-radius:10px;font:inherit;font-size:16px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.opts button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:6px 0;font:inherit;color:var(--ink)}
.opts button.on{border-color:var(--brand);background:var(--brand2);font-weight:600}
.rt{cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.rt.on{border-color:var(--brand)}
.rt .lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.rt .nm{font-family:'Sacramento',cursive;font-size:38px;line-height:1.15;color:var(--brand);margin:2px 0 4px}
.rt .meta{font-size:15px}
.rt .pick{float:right;font-size:13px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:3px 10px;background:#fff}
.rt.on .pick{background:var(--brand);color:#fff;border-color:var(--brand)}
.readmore{display:inline-block;margin-top:8px;font-weight:500}
.more{display:none;margin-top:10px;font-size:16px;border-top:1px solid var(--line);padding-top:10px}.rt.open .more{display:block}
.thanks{text-align:center;padding:20px 16px}.thanks .big2{font-family:'Sacramento',cursive;font-size:50px;color:var(--brand);line-height:1.1;margin-bottom:6px}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.it .l{min-width:0}.it .r{text-align:right;white-space:nowrap}
.it .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tap{cursor:pointer}
.chip{display:inline-block;padding:2px 8px;border-radius:9px;font-size:12px;font-weight:600}
.c-Paid,.c-Confirmed{background:var(--okbg);color:var(--ok)}.c-Partly{background:var(--warnbg);color:var(--warn)}
.c-Reported,.c-Being{background:var(--infobg);color:var(--info)}.c-Not,.c-Check{background:var(--badbg);color:var(--bad)}.c-Free{background:#eee;color:#555}.c-Pending{background:var(--warnbg);color:var(--warn)}.c-Registered{background:var(--okbg);color:var(--ok)}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.msg{padding:12px 14px;border-radius:12px;margin:10px 0;font-size:16px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.err{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--infobg);color:var(--info)}
.stat{display:flex;gap:8px;margin:10px 0}.stat div{flex:1;background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stat b{display:block;font-size:18px}.stat span{font-size:13px;color:var(--mute)}
.loading{text-align:center;color:var(--mute);padding:60px 0}
.hint{font-size:14px;color:var(--mute);margin-top:5px}
.split{display:flex;gap:8px;margin-top:6px}.split select{flex:2}.split input{flex:1}
a{color:var(--brand)}
.hide{display:none}
input::placeholder{text-transform:none}
</style>
<style>
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin:12px 0}
.grp{background:#fff6cf;border-radius:12px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.12);min-height:96px}
.grp.un{background:#eef0ee}
.grp.target{outline:2px dashed var(--brand);outline-offset:2px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:15px;margin-bottom:4px}
.gc{background:rgba(0,0,0,.08);border-radius:10px;padding:1px 8px;font-size:13px}
.gl{min-height:44px}
.pc{background:#fff;border-radius:8px;padding:8px 10px;margin:6px 0;box-shadow:0 1px 2px rgba(0,0,0,.15);font-size:14px;cursor:grab;user-select:none;-webkit-user-select:none}
.pc.sel{outline:2px solid var(--brand)}
.pc .sub{font-size:12px}
.sortable-ghost{opacity:.35}
.news{background:#fff6cf}
.mine{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
details.reg summary{cursor:pointer;font-weight:600;list-style:none}
details.reg summary::-webkit-details-marker{display:none}
.paysec{margin-top:32px}
.frow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.frow.tot{font-weight:700;font-size:17px;border-bottom:2px solid var(--line)}
.frow .op{color:var(--mute);width:16px;display:inline-block}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.over{background:var(--bad)}
.rtd{max-height:5.2em;overflow:hidden;margin-top:8px;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.rtd.open{max-height:none;-webkit-mask-image:none;mask-image:none}
</style>

var AUTH = {};
var S = { stack: [] };

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n,cur){n=Number(n)||0;var s=Math.round(n*100)/100;return (cur&&cur!=='KES'?cur+' ':'')+s.toLocaleString('en-US',{maximumFractionDigits:2})+(cur==='KES'||!cur?' KES':'')}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function call(fn){var args=[].slice.call(arguments,1);return fetch(API,{method:'POST',body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json()},function(){throw 'No internet connection. Please try again.'}).then(function(d){if(!d.ok)throw String(d.e).replace(/^(Exception|Error):\s*/,'');return d.r})}
function render(html){$('app').innerHTML=html;window.scrollTo(0,0)}
function busy(btn,on){if(!btn)return;btn.disabled=on;if(on){btn.dataset.t=btn.textContent;btn.textContent='Please wait…'}else if(btn.dataset.t)btn.textContent=btn.dataset.t}
function showMsg(id,text,kind){var el=$(id);if(el){el.innerHTML='<div class="msg '+(kind||'ok')+'">'+esc(text)+'</div>';el.scrollIntoView({block:'center'})}}
function chip(st){var c=String(st||'').split(' ')[0];return '<span class="chip c-'+esc(c)+'">'+esc(st)+'</span>'}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>').replace(/(\+?\d[\d ]{7,}\d)/g,function(m){return '<a href="tel:'+m.replace(/\s/g,'')+'">'+m+'</a>'}).replace(/\n/g,'<br>')}
function openPerson(id){if(S.people)go(personView,id);else loadPeople().then(function(){go(personView,id)})}
function pchip(st){var L={Pending:'Signed up',Reported:'Payment sent',Registered:'Registered',Paid:'Paid in full',Free:'Free'};return '<span class="chip c-'+esc(st)+'">'+esc(L[st]||st)+'</span>'}
function acc(id){return (S.lists.accounts.filter(function(a){return a.id===id})[0])||{name:id,cur:''}}
function sem(id){return (S.lists.seminars.filter(function(s){return s.id===id})[0])||{name:id||''}}
function person(id){return (S.lists.people.filter(function(p){return p.id===id})[0])||null}
function opts(list,sel,valKey,labKey,blank){return (blank?'<option value="">'+esc(blank)+'</option>':'')+list.map(function(x){var v=x[valKey];return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(x[labKey])+'</option>'}).join('')}
function topbar(title,back){return '<div class="top">'+(back?'<button class="back" onclick="goBack()">‹ Back</button>':'')+'<h1>'+esc(title)+'</h1></div>'}
function go(fn,arg){S.stack.push([fn,arg]);fn(arg)}
function goBack(){S.stack.pop();var p=S.stack[S.stack.length-1];if(p)p[0](p[1]);else teamHome()}
function phone254(p){var d=String(p||'').replace(/\D/g,'');if(d.indexOf('0')===0)d='254'+d.slice(1);if(d.length===9)d='254'+d;return d}

/* ---------- start ---------- */
(function start(){
  window.TEST=!!PARAMS.test;
  if(TEST)document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;top:8px;right:8px;z-index:99;background:#b5523b;color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px">TEST VIEW</div>');
  if(PARAMS.t&&!TEST){store('sc_t',PARAMS.t)}
  if(PARAMS.p&&!TEST){store('sc_p',PARAMS.p)}
  if(PARAMS.signup){AUTH={}}
  else if(PARAMS.t){AUTH={t:PARAMS.t}}
  else if(PARAMS.p){AUTH={p:PARAMS.p}}
  else if(store('sc_t')){AUTH={t:store('sc_t')}}
  else if(store('sc_p')){AUTH={p:store('sc_p')}}
  var CK=AUTH.t?'sc_c_'+AUTH.t:'',cached=null;
  try{cached=CK?JSON.parse(store(CK)||'null'):null}catch(e){}
  if(cached&&cached.mode==='team'){applyInit(cached);try{S.people=JSON.parse(store('sc_pp_'+AUTH.t)||'null')}catch(e){}}
  call('init',AUTH).then(function(r){
    if(CK&&r.mode==='team')store(CK,JSON.stringify(r));
    applyInit(r,!!cached);
  }).catch(function(e){
    if(cached&&/internet/i.test(String(e)))return;
    if(!window.TEST){if(AUTH.t)store('sc_t',null);if(AUTH.p)store('sc_p',null);if(CK)store(CK,null)}
    render('<h1>Soul Care</h1><div class="msg err">'+esc(e)+'</div><button class="btn light" onclick="location.reload()">Try again</button>')
  });
})();
function applyInit(r,refresh){
  S.mode=r.mode;
  S.pay=r.pay||{};
  if(r.mode==='team'){S.me=r.me;S.admin=r.admin;S.finance=r.finance;S.lists=r.lists;S.home=r.home;
    if(!refresh){S.stack=[[teamHome]];teamHome()}else if(S.stack.length===1&&S.stack[0][0]===teamHome)teamHome();
    if(refresh||!S.people)loadPeople();}
  else if(r.mode==='participant'){S.pv=r.view;S.info=r.info;S.payTo=r.payTo;S.contact=r.contact;S.arrival=r.arrival;S.thanks=r.thanks;partHome()}
  else{S.seminars=r.seminars;S.info=r.info;S.contact=r.contact;signupView()}
}
function loadPeople(){
  if(S.peopleP)return S.peopleP;

    .catch(function(e){S.peopleP=null;if($('p_out')&&!S.people)$('p_out').innerHTML='<div class="msg err">'+esc(e)+'</div>'});

  '<div class="card"><h3>Personal</h3>'+ta('s_journey','How would you describe where you are at the moment in your journey with God?')+ta('s_hope','What do you hope for from this retreat?')+ta('s_prayer','Is there anything specific we can pray for in the coming weeks?')+'</div>'+

function pickRetreat(id){S.sel=id;S.seminars.forEach(function(s){var el=$('rt_'+s.id);if(!el)return;var on=s.id===id;el.classList.toggle('on',on);el.querySelector('.pick').textContent=on?'✓ Chosen':'Choose'})}
function toggleMore(id){var el=$('rt_'+id);el.classList.toggle('open');el.querySelector('.readmore').textContent=el.classList.contains('open')?'Show less ‹':'Read more ›'}
function fmtRange(a,b){var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];function f(x){var p=String(x).split('-');return p.length===3?(+p[2])+' '+m[+p[1]-1]+' '+p[0]:x}return a?(b?f(a)+' – '+f(b):f(a)):''}

function doSignup(btn){

  $('f_pwrap').className=f==='OUT-PART'?'':'hide';

function txSms(){
  var txt=$('f_sms').value,el=$('f_smsinfo'),L=parseSms(txt);
  if(!txt.trim()){el.innerHTML='';return}
  if(!L.length){el.innerHTML='<div class="hint neg">No M-Pesa code found yet – please paste the whole message.</div>';return}
  if(L.length>1){el.innerHTML='<div class="msg info">'+L.length+' messages found. <a href="#" onclick="txMany();return false">Handle all of them together</a></div>';return}
  var x=L[0],msg='',pid='';
  if(x.dir==='in'){
    $('f_from').value='OUT-PART';$('f_to').value='KE-PHONE';S.form.smsParty=x.party||'';
    var ck=(S.home.toCheck||[]).filter(function(c){return String(c['M-Pesa code / Ref']).toUpperCase()===x.code&&c['Participant ID']})[0];
    if(ck)pid=ck['Participant ID'];
    var dg=String(x.phone||'').replace(/\D/g,'');
    if(!pid&&dg.length>=9&&String(x.phone).indexOf('*')<0){var hp=S.lists.people.filter(function(p){return String(p.phone).replace(/\D/g,'').slice(-9)===dg.slice(-9)});if(hp.length===1)pid=hp[0].id}
    if(!pid&&x.party){var n=x.party.toLowerCase().replace(/\s+/g,' ');var hn=S.lists.people.filter(function(p){return String(p.name).toLowerCase().replace(/\s+/g,' ').trim()===n});if(hn.length===1)pid=hn[0].id}
    if(pid)$('f_pname').value=personLabel(pid);
    msg='Received '+money(x.amount)+' from '+(x.party||'?')+(pid?' – this looks like '+person(pid).name+'.':' – pick the participant below (or change “From” if it was a donor).');
  }else if(x.dir==='withdraw'){$('f_from').value='KE-PHONE';$('f_to').value='KE-CASH';$('f_desc').value='Cash withdrawal';msg='Cash withdrawal of '+money(x.amount)+'.'}
  else if(x.dir==='out'){$('f_from').value='KE-PHONE';$('f_to').value='OUT-VENDOR';$('f_party').value=x.party||'';msg='Paid '+money(x.amount)+' to '+(x.party||'?')+' – please choose what it was for.'}
  else msg='Could not tell which way the money went – please choose From and To.';
  $('f_amt').value=x.amount||'';if(x.date)$('f_date').value=x.date;$('f_code').value=x.code;$('f_fee').value=x.fee||'';
  txUpdate();txMore();
  el.innerHTML='<div class="msg ok">✓ '+esc(msg)+'</div>';
}

    var a=Number($('f_amt').value),rec=Number($('f_rec').value),el=$('f_rate');if(!el)return;

    var txt=r?'Market rate today: 1 '+S.cf+' = '+(Math.round(r*100)/100)+' '+S.ct+'. ':'';
    if(a&&rec)txt+='Rate used: 1 '+S.cf+' = '+(Math.round(rec/a*100)/100)+' '+S.ct+'.';
    el.textContent=txt+(S.recTouched?'':' Change the amount to what actually arrived, if different.');
  });

function readImg(file){return new Promise(function(res){if(!file)return res('');var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){var m=1400,w=img.width,h=img.height,k=Math.min(1,m/Math.max(w,h));var c=document.createElement('canvas');c.width=w*k;c.height=h*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.75))};img.onerror=function(){res('')};img.src=fr.result};fr.readAsDataURL(file)})}

    description:$('f_desc').value,date:$('f_date').value,code:$('f_code').value,notes:S.form.notes,splits:splits};

function smsView(){
  render(topbar('Paste M-Pesa SMS',true)+'<div class="card"><div class="sub">Copy one or many M-Pesa messages from the phone and paste them here.</div>'+
  '<textarea id="m_txt" style="min-height:160px" placeholder="TJ1FX66L6H Confirmed. You have received Ksh2,000.00 from …"></textarea>'+
  '<button class="btn" onclick="smsParse()">Read messages</button><div id="m_out"></div></div>');
}
function parseSms(text){
  var parts=String(text).split(/(?=\b[A-Z0-9]{10}\s+Confirmed)/);
  return parts.map(function(s){
    var m=s.match(/\b([A-Z0-9]{10})\s+Confirmed/);if(!m)return null;
    var o={code:m[1]};
    var a=s.match(/Ksh\s?([\d,]+(?:\.\d{1,2})?)/i);o.amount=a?Number(a[1].replace(/,/g,'')):0;
    var d=s.match(/on\s+(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(d){var y=d[3].length===2?'20'+d[3]:d[3];o.date=y+'-'+('0'+d[2]).slice(-2)+'-'+('0'+d[1]).slice(-2)}
    var tm=s.match(/at\s+(\d{1,2}:\d{2}\s*[AP]M)/i);if(tm)o.time=tm[1];
    var c=s.match(/Transaction cost,?\s*Ksh\s?([\d,]+(?:\.\d{1,2})?)/i);o.fee=c?Number(c[1].replace(/,/g,'')):0;
    var b=s.match(/balance is\s*Ksh\s?([\d,]+(?:\.\d{1,2})?)/i);o.balance=b?Number(b[1].replace(/,/g,'')):null;
    var r;
    if(/you have received/i.test(s)){o.dir='in';r=s.match(/from\s+(.+?)\s+on\s+\d{1,2}\//i);
      if(r){var who=r[1];var ph=who.match(/(\+?\d[\d*]{6,})\s*$/);if(ph){o.phone=ph[1];who=who.slice(0,ph.index)}o.party=who.replace(/[.\s]+$/,'').trim()}}
    else if(/withdraw/i.test(s)){o.dir='withdraw';o.party='Cash withdrawal'}
    else if(/sent to/i.test(s)){o.dir='out';r=s.match(/sent to\s+(.+?)\s+on\s+\d{1,2}\//i);if(r)o.party=r[1].replace(/\s+for account.*$/i,'').replace(/\s+\+?\d[\d*]{6,}\s*$/,'').replace(/[.\s]+$/,'').trim()}
    else if(/paid to/i.test(s)){o.dir='out';r=s.match(/paid to\s+(.+?)\s+on\s+\d{1,2}\//i);if(r)o.party=r[1].replace(/[.\s]+$/,'').trim()}
    else o.dir='?';
    return o;
  }).filter(Boolean);
}
function smsParse(){
  var items=parseSms($('m_txt').value);S.sms=items;
  if(!items.length){$('m_out').innerHTML='<div class="msg err">No M-Pesa messages found. Copy the whole SMS including the code at the start.</div>';return}
  var ins=insideAccs().filter(function(a){return a.cur==='KES'});
  var rec=items.filter(function(x){return x.dir==='in'}),out=items.filter(function(x){return x.dir!=='in'});
  var h='';
  if(rec.length){h+='<h3>Money received ('+rec.length+')</h3><div class="list">'+rec.map(function(x){return '<div class="it"><div class="l"><div class="t">'+esc(x.party||'?')+'</div><div class="sub">'+esc(x.code)+' · '+esc(x.date||'')+'</div></div><div class="r">'+money(x.amount)+'</div></div>'}).join('')+'</div>'+
    '<label>These arrived on</label><select id="m_to">'+opts(ins,'KE-PHONE','id','name')+'</select>'+
    '<div class="hint">They are saved as participant payments. If a participant already reported the code, it gets confirmed automatically. Payers we can\'t recognise go to "To check".</div>'+
    '<button class="btn" onclick="smsSave(this)">Save '+rec.length+' received payment'+(rec.length>1?'s':'')+'</button>'}
  if(out.length){h+='<h3>Money sent / paid ('+out.length+')</h3><div class="hint">Tap each one to add what it was for.</div><div class="list">'+out.map(function(x,i){return '<div class="it tap" onclick="smsOut('+items.indexOf(x)+')"><div class="l"><div class="t">'+esc(x.party||'?')+'</div><div class="sub">'+esc(x.code)+' · '+esc(x.date||'')+(x.fee?' · fee '+x.fee:'')+'</div></div><div class="r">'+money(x.amount)+' ›</div></div>'}).join('')+'</div>'}
  $('m_out').innerHTML=h;
}
function smsOut(i){var x=S.sms[i];if(x.dir==='withdraw'){go(txForm,{from:'KE-PHONE',to:'KE-CASH',amount:x.amount,fee:x.fee,date:x.date,code:x.code,description:'Cash withdrawal'})}else go(txForm,{from:'KE-PHONE',to:'OUT-VENDOR',amount:x.amount,fee:x.fee,date:x.date,code:x.code,party:x.party})}
function smsSave(btn){
  var rec=S.sms.filter(function(x){return x.dir==='in'});var allIn=rec.length===S.sms.length;var last=allIn?S.sms.filter(function(x){return x.balance!=null}).pop():null;
  busy(btn,true);
  call('teamImportSms',AUTH,{items:rec,to:$('m_to').value,smsBalance:last?{amount:last.balance}:null}).then(function(r){
    S.home=r.home;return refreshHome().then(function(){
    render(topbar('SMS saved',false)+'<div class="card"><div class="list">'+r.results.map(function(x){return '<div class="it"><div class="l"><div class="t">'+esc(x.code)+'</div></div><div class="r sub" style="white-space:normal">'+esc(x.msg)+'</div></div>'}).join('')+'</div></div>'+
    (S.sms.some(function(x){return x.dir!=='in'})?'<button class="btn light" onclick="smsBackToOut()">Now add the money sent / paid</button>':'')+
    '<button class="btn" onclick="teamHome()">Home</button>')})}).catch(function(e){busy(btn,false);alert(e)});
}
function smsBackToOut(){S.sms=S.sms.filter(function(x){return x.dir!=='in'});S.stack=[[teamHome],[smsView]];smsView();$('m_txt').value='';smsRender()}
function smsRender(){var items=S.sms;var h='<h3>Money sent / paid ('+items.length+')</h3><div class="list">'+items.map(function(x,i){return '<div class="it tap" onclick="smsOut('+i+')"><div class="l"><div class="t">'+esc(x.party||'?')+'</div><div class="sub">'+esc(x.code)+' · '+esc(x.date||'')+'</div></div><div class="r">'+money(x.amount)+' ›</div></div>'}).join('')+'</div>';$('m_out').innerHTML=h}

}
function partnerOpts(){var el=$('e_Prayerpartner');if(!el)return;var cur=el.value||S.editPartner||'',sm=$('e_Seminar').value;
  var l=S.lists.team.filter(function(m){return m.active&&(!m.seminars||!m.seminars.length||m.seminars.indexOf(sm)>=0)});
  if(cur&&!l.some(function(m){return m.name===cur}))l.push({name:cur});
  el.innerHTML=opts([{v:'',l:'– none –'}].concat(l.map(function(m){return {v:m.name,l:m.name}})),cur,'v','l')}
function savePerson(id,btn){
  var keys=['Name','Phone','Gender','Seminar','Role','Prayer partner','Age','Nationality','Dietary needs','Photo consent','Price','Discount','Discount reason','Sponsor','Room','Checked in','Notes'];
  var d={ID:id};keys.forEach(function(k){var el=$('e_'+k.replace(/\W/g,''));if(el)d[k]=el.value});
  busy(btn,true);
  call('teamPersonSave',AUTH,d).then(function(r){S.people=r.people;return refreshHome().then(function(){S.stack.pop();var nid=id||r.people[r.people.length-1].ID;S.stack[S.stack.length-1]=[personView,nid];personView(nid)})})
  .catch(function(e){busy(btn,false);showMsg('e_msg',e,'err')});
}
function smsFill(p){var t=$(p+'_sms').value,el=$(p+'_smsinfo'),x=parseSms(t)[0];
  if(!t.trim()){el.innerHTML='';return}
  if(!x||!x.amount){el.innerHTML='<span class="neg">We could not read this. Please copy the whole M-Pesa message, starting with the code.</span>';return}
  if(x.dir!=='out'){el.innerHTML='<span class="neg">This looks like a message about money received, not money you sent. Please paste the SMS for your payment.</span>';return}
  var ok=paidToUs(t);
  el.innerHTML=(ok?'<span class="pos">✓ Payment found: </span>':'<span class="neg">⚠ This was sent to '+esc(x.party||'?')+', not to '+esc(payName())+'. The team will check it. </span>')+'<b>'+money(x.amount)+'</b> on '+esc(fmtRange(x.date))+(x.time?' at '+esc(x.time):'')+' · code '+esc(x.code)}
function smsGet(p){var t=$(p+'_sms').value,x=parseSms(t)[0];
  if(!x||!x.amount||x.dir!=='out'){smsFill(p);showMsg(p+'_msg',t.trim()?'Please paste the complete M-Pesa SMS for your payment.':'Please paste your M-Pesa SMS first.','err');return null}
  return x}
function payName(){return (S.pay&&S.pay.name)||'Soul Care Retreat'}
function paidToUs(t){var p=S.pay||{},w=String(p.name||'Soul Care').toLowerCase().split(/\s+/).filter(function(x){return x.length>2}).slice(0,2),d=String(p.phone||'').replace(/\D/g,'').slice(-9),l=String(t).toLowerCase(),n=l.replace(/\D/g,'');return (w.length>0&&w.every(function(x){return l.indexOf(x)>=0}))||(d.length===9&&n.indexOf(d)>=0)}
function teamView(){
  render(topbar('Team',true)+'<div id="tm_out"><div class="loading">Loading…</div></div>');
  call('teamMembers',AUTH).then(function(l){S.members=l;teamRender()}).catch(function(e){$('tm_out').innerHTML='<div class="msg err">'+esc(e)+'</div>'});
}
function semNames(a){return a&&a.length?a.map(function(id){return rtParts(sem(id).name).nm}).join(' & '):'Both retreats'}
function teamRender(){
  var l=S.members;
  var base=(l.filter(function(m){return m.link})[0]||{link:''}).link.split('?')[0];
  $('tm_out').innerHTML=(base?'<div class="card"><h3>🧪 Testing</h3><div class="sub">"View as" opens the app exactly as that person sees it, without changing who this phone is signed in as. Anything you save there is real data – start test names with TEST so they are easy to delete.</div><a class="btn light" style="text-align:center;text-decoration:none" target="_blank" href="'+esc(base+'?signup=1&test=1')+'">Open sign-up form (test)</a></div>':'')+'<button class="btn light" onclick="memberEdit(-1)">+ Add team member</button>'+
  l.map(function(m,i){return '<div class="card"><div class="it" style="border:0;padding:0"><div class="l"><div class="t">'+esc(m.name)+(m.active?'':' <span class="chip c-Not">switched off</span>')+'</div><div class="sub">'+esc(m.role||'')+' · '+esc(semNames(m.seminars))+' · '+m.group.length+' in prayer group</div></div><div class="r">'+(m.link?'<a class="btn small light" style="text-decoration:none;margin-bottom:4px" target="_blank" href="'+esc(m.link+'&test=1')+'">👁 View as</a>':'')+'<button class="btn small light" onclick="memberEdit('+i+')">Edit</button></div></div>'+
    (m.group.length?'<div class="list" style="margin-top:6px">'+m.group.map(function(p){return '<div class="it"><div class="l"><div>'+esc(p.name)+'</div><div class="sub">'+esc(rtParts(sem(p.seminar).name).nm)+'</div></div><div class="r">'+pchip(p.status)+'</div></div>'}).join('')+'</div>':'')+
    '</div>'}).join('')+'<div class="hint">To assign a prayer partner: Participants → tap a name → Edit details.</div>';
}
function memberEdit(i){
  var m=i>=0?S.members[i]:{name:'',role:'Team member',phone:'',active:true,link:'',seminars:[]};
  var wa=m.link&&m.phone?'https://wa.me/'+phone254(m.phone)+'?text='+encodeURIComponent('Hello '+m.name+', here is your personal Soul Care link. Please keep it private: '+m.link):'';
  var desc={'Team member':'Participants and prayer groups, no money','Finance':'Also tracks money','Admin':'Everything, including this team list'};
  render(topbar(i>=0?'Edit team member':'New team member',false)+'<div class="card">'+
  '<label>Name</label><input id="m_name" value="'+esc(m.name)+'">'+
  '<label>Part of which retreats?</label><div class="opts" id="m_sems">'+S.lists.seminars.filter(function(s){return s.id!=='GEN'}).map(function(s){var on=!m.seminars||!m.seminars.length||m.seminars.indexOf(s.id)>=0;return '<button data-v="'+s.id+'" class="'+(on?'on':'')+'" onclick="this.classList.toggle(\'on\')">'+esc(rtParts(s.name).nm)+'</button>'}).join('')+'</div>'+
  '<label>Role</label><div class="opts" id="m_role" data-v="'+esc(m.role)+'">'+['Team member','Finance','Admin'].map(function(r){return '<button data-v="'+r+'" class="'+(r===m.role?'on':'')+'" onclick="segPick(this)">'+r+'<div class="sub">'+desc[r]+'</div></button>'}).join('')+'</div>'+
  '<label>Phone (for WhatsApp)</label><input id="m_phone" type="tel" value="'+esc(m.phone||'')+'">'+
  '<label>Access</label><div class="seg" id="m_act" data-v="'+(m.active?'1':'0')+'"><button data-v="1" class="'+(m.active?'on':'')+'" onclick="segPick(this)">Active</button><button data-v="0" class="'+(m.active?'':'on')+'" onclick="segPick(this)">Switched off</button></div>'+
  '<div id="m_msg"></div><button class="btn" onclick="memberSave('+i+',this)">Save</button>'+
  (m.link?'<div class="card" style="background:var(--brand2)"><h3>Personal link</h3><div class="sub" style="word-break:break-all">'+esc(m.link)+'</div>'+(wa?'<a class="btn" style="text-align:center;text-decoration:none" target="_blank" href="'+esc(wa)+'">Send link on WhatsApp</a>':'<div class="hint">Add a phone number to send it on WhatsApp.</div>')+'</div>':'')+
  '<button class="btn light" onclick="teamView()">Back</button></div>');
}
function memberSave(i,btn){var orig=i>=0?S.members[i].name:'';
  var all=$('m_sems').querySelectorAll('button'),on=[].filter.call(all,function(b){return b.classList.contains('on')}).map(function(b){return b.dataset.v});
  if(!on.length){showMsg('m_msg','Please choose at least one retreat.','err');return}
  busy(btn,true);
  call('teamMemberSave',AUTH,{orig:orig,name:$('m_name').value,role:$('m_role').dataset.v||'Team member',phone:$('m_phone').value,active:$('m_act').dataset.v!=='0',seminars:on.length===all.length?[]:on})
  .then(function(l){S.members=l;return refreshHome()}).then(function(){var n=$('m_name').value.trim(),j=S.members.map(function(m){return m.name}).indexOf(n);S.stack=[[teamHome],[teamView]];if(j>=0)memberEdit(j);else teamView()})
  .catch(function(e){busy(btn,false);showMsg('m_msg',e,'err')})}
function partnerHome(){
  var g=S.group||[];
  var h='<div class="hero sm" style="background-image:url('+HERO+')"><div class="ttl">Soul Care</div></div><h1>Hello '+esc(S.me)+'</h1><div class="sub">Your prayer group: '+g.length+' '+(g.length===1?'person':'people')+'. Thank you for praying for them!</div>';
  h+=g.length?g.map(function(p){var wa=p.phone?'https://wa.me/'+phone254(p.phone):'';var st=p.status==='Pending'||p.status==='Reported'?'Pending':'Registered';
    return '<div class="card"><div class="it" style="border:0;padding:0"><div class="l"><div class="t">'+esc(p.name)+'</div><div class="sub">'+esc(rtParts(p.seminar).nm)+(p.age?' · age '+esc(p.age):'')+'</div></div><div class="r">'+chip(st)+'</div></div>'+
    (p.phone?'<div style="margin:8px 0"><a href="tel:'+esc(p.phone)+'">📞 '+esc(p.phone)+'</a>'+(wa?' · <a target="_blank" href="'+esc(wa)+'">WhatsApp</a>':'')+'</div>':'')+
    [['journey','Journey with God'],['hope','Hope for the retreat'],['prayer','Prayer requests'],['diet','Dietary needs']].filter(function(x){return p[x[0]]}).map(function(x){return '<div style="margin:6px 0"><div class="sub">'+x[1]+'</div><div>'+esc(p[x[0]])+'</div></div>'}).join('')+'</div>'}).join(''):'<div class="card">No one has been assigned to you yet. The team will let you know.</div>';
  h+='<div class="hint" style="text-align:center;margin-top:16px"><a href="#" onclick="call(\'partnerHome\',AUTH).then(function(r){S.group=r.group;partnerHome()});return false">↻ Refresh</a></div>';
  render(h);
}
function regBanner(p,sm){var st=p.Status,rep=Number(p['Paid (reported)'])||0;
  if(st==='Paid')return '<div class="msg ok">✓ <b>Fully paid.</b> Your place is secured. We look forward to seeing you!</div>';
  if(st==='Registered'||st==='Free')return '<div class="msg ok">✓ <b>Registered.</b> Your place is secured.'+(p.Balance>0?' The remaining '+money(p.Balance)+' can be paid in parts before the retreat.':'')+'</div>'+(rep>0?'<div class="msg info">'+money(rep)+' reported by you, waiting for the team to confirm.</div>':'');
  if(rep>0)return '<div class="msg info"><b>Payment being checked.</b> We have your payment of '+money(rep)+'. Your registration will be confirmed as soon as the team has checked it.</div>';
  return '<div class="msg err"><b>Registration pending.</b> Your place is only secured once the registration fee of '+money(sm.deposit||2000)+' has been paid. Send it by M-Pesa ("Send money") to '+esc(payName()+(S.pay&&S.pay.phone?', '+S.pay.phone:''))+', then tap the button below and paste the confirmation SMS. If someone else paid for you, paste the message they received.</div>'}
function answers(p){var q=[['Age','Age'],['Nationality','Nationality'],['Dietary needs','Dietary needs'],['Photo consent','Photos'],['Journey with God','Journey with God'],['Hope for retreat','Hope for the retreat'],['Prayer requests','Prayer requests'],['Notes','Notes']].filter(function(x){return p[x[0]]!==''&&p[x[0]]!=null});
  return q.length?'<div class="card"><h3>Registration answers</h3>'+q.map(function(x){return '<div style="margin:8px 0"><div class="sub">'+esc(x[1])+'</div><div>'+esc(p[x[0]])+'</div></div>'}).join('')+'</div>':''}
</script>
</body>
</html>
