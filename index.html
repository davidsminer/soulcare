<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<title>Soul Care</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ec;--card:rgba(255,255,255,.93);--ink:#2f4a3a;--mute:#6c8172;--line:#d6e2d8;--brand:#4b7a5c;--brand2:#e2ede4;--warn:#a8632a;--warnbg:#f8ecdf;--bad:#a24646;--badbg:#f6e3e3;--ok:#2f7a4d;--okbg:#e1f0e5;--info:#3d6f84;--infobg:#e2eef3}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(55% 35% at 0% 0%,rgba(110,180,140,.30),transparent 70%),radial-gradient(50% 30% at 100% 100%,rgba(110,180,140,.28),transparent 70%),radial-gradient(45% 25% at 0% 100%,rgba(160,210,180,.25),transparent 70%)}
#app{max-width:560px;margin:0 auto;padding:12px 16px 80px}
h1{font-size:24px;font-weight:500;margin:6px 0 2px}h2{font-size:19px;font-weight:500;margin:18px 0 8px}
h3{font-size:14px;font-weight:600;margin:2px 0 8px;color:var(--brand);text-transform:uppercase;letter-spacing:.08em}
p{margin:0 0 10px}
.sub{color:var(--mute);font-size:15px}
.hero{position:relative;margin:-12px -16px 6px;aspect-ratio:520/239;background-size:cover;background-position:center top}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(238,242,236,0) 45%,var(--bg) 100%)}
.hero .ttl{position:absolute;z-index:1;left:18px;bottom:12px;font-family:'Sacramento',cursive;font-size:52px;line-height:1;color:#3b6a4c;text-shadow:0 0 14px rgba(255,255,255,.95)}
.hero.sm{aspect-ratio:auto;height:118px}.hero.sm .ttl{font-size:42px;bottom:6px}
.lead{font-size:17px;margin:4px 0 12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .back{border:0;background:var(--card);border-radius:10px;padding:8px 12px;font:inherit;font-size:16px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(40,70,50,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.big{border:0;border-radius:16px;padding:16px 12px;background:var(--card);font:inherit;font-size:16px;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgba(40,70,50,.1);text-align:left;min-height:78px}
.big .i{display:block;font-size:22px;margin-bottom:4px}
.big.main{background:var(--brand);color:#fff}
.badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:11px;background:var(--bad);color:#fff;font-size:13px;text-align:center;margin-left:4px}
label{display:block;font-size:15px;color:var(--mute);margin:14px 0 5px}
input,select,textarea{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(75,122,92,.15)}
textarea{min-height:96px}
.row{display:flex;gap:10px}.row>*{flex:1}
@media(max-width:520px){.row{display:block}}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:600;font-family:inherit;background:var(--brand);color:#fff;margin-top:16px}
.btn.light{background:var(--brand2);color:var(--brand)}.btn.red{background:var(--badbg);color:var(--bad)}
.btn.small{display:inline-block;width:auto;padding:8px 12px;font-size:15px;margin:6px 6px 0 0}
.seg{display:flex;background:#e3e9e2;border-radius:12px;padding:3px;margin:6px 0}
.seg button{flex:1;border:0;background:transparent;padding:11px 4px;border-radius:10px;font:inherit;font-size:16px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.opts button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:6px 0;font:inherit;color:var(--ink)}
.opts button.on{border-color:var(--brand);background:var(--brand2);font-weight:600}
.rt{cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.rt.on{border-color:var(--brand)}
.rt .lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.rt .nm{font-family:'Sacramento',cursive;font-size:38px;line-height:1.15;color:var(--brand);margin:2px 0 4px}
.rt .meta{font-size:15px}
.rt .pick{float:right;font-size:13px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:3px 10px;background:#fff}
.rt.on .pick{background:var(--brand);color:#fff;border-color:var(--brand)}
.readmore{display:inline-block;margin-top:8px;font-weight:500}
.more{display:none;margin-top:10px;font-size:16px;border-top:1px solid var(--line);padding-top:10px}.rt.open .more{display:block}
.thanks{text-align:center;padding:20px 16px}.thanks .big2{font-family:'Sacramento',cursive;font-size:50px;color:var(--brand);line-height:1.1;margin-bottom:6px}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.it .l{min-width:0}.it .r{text-align:right;white-space:nowrap}
.it .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tap{cursor:pointer}
.chip{display:inline-block;padding:2px 8px;border-radius:9px;font-size:12px;font-weight:600}
.c-Paid,.c-Confirmed{background:var(--okbg);color:var(--ok)}.c-Partly{background:var(--warnbg);color:var(--warn)}
.c-Reported,.c-Being{background:var(--infobg);color:var(--info)}.c-Not,.c-Check{background:var(--badbg);color:var(--bad)}.c-Free{background:#eee;color:#555}.c-Pending{background:var(--warnbg);color:var(--warn)}.c-Registered{background:var(--okbg);color:var(--ok)}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.msg{padding:12px 14px;border-radius:12px;margin:10px 0;font-size:16px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.err{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--infobg);color:var(--info)}
.stat{display:flex;gap:8px;margin:10px 0}.stat div{flex:1;background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stat b{display:block;font-size:18px}.stat span{font-size:13px;color:var(--mute)}
.loading{text-align:center;color:var(--mute);padding:60px 0}
.hint{font-size:14px;color:var(--mute);margin-top:5px}
.split{display:flex;gap:8px;margin-top:6px}.split select{flex:2}.split input{flex:1}
a{color:var(--brand)}
.hide{display:none}
input::placeholder{text-transform:none}
</style>
<style>
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin:12px 0}
.grp{background:#fff6cf;border-radius:12px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.12);min-height:96px}
.grp.un{background:#eef0ee}
.grp.target{outline:2px dashed var(--brand);outline-offset:2px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:15px;margin-bottom:4px}
.gc{background:rgba(0,0,0,.08);border-radius:10px;padding:1px 8px;font-size:13px}
.gl{min-height:44px}
.pc{background:#fff;border-radius:8px;padding:8px 10px;margin:6px 0;box-shadow:0 1px 2px rgba(0,0,0,.15);font-size:14px;cursor:grab;user-select:none;-webkit-user-select:none}
.pc.sel{outline:2px solid var(--brand)}
.pc .sub{font-size:12px}
.sortable-ghost{opacity:.35}
.news{background:#fff6cf}
.mine{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
details.reg summary{cursor:pointer;font-weight:600;list-style:none}
details.reg summary::-webkit-details-marker{display:none}
.paysec{margin-top:32px}
.frow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.frow.tot{font-weight:700;font-size:17px;border-bottom:2px solid var(--line)}
.frow .op{color:var(--mute);width:16px;display:inline-block}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.over{background:var(--bad)}
.rtd{max-height:5.2em;overflow:hidden;margin-top:8px;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.rtd.open{max-height:none;-webkit-mask-image:none;mask-image:none}
</style>

var AUTH = {};
var S = { stack: [] };

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n,cur){n=Number(n)||0;var s=Math.round(n*100)/100;return (cur&&cur!=='KES'?cur+' ':'')+s.toLocaleString('en-US',{maximumFractionDigits:2})+((cur==='KES'||!cur)&&!window.NOKES?' KES':'')}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function call(fn){var args=[].slice.call(arguments,1);return fetch(API,{method:'POST',body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json()},function(){throw 'No internet connection. Please try again.'}).then(function(d){if(!d.ok)throw String(d.e).replace(/^(Exception|Error):\s*/,'');return d.r})}
function render(html){$('app').innerHTML=html;window.scrollTo(0,0)}
function busy(btn,on){if(!btn)return;btn.disabled=on;if(on){btn.dataset.t=btn.textContent;btn.textContent='Please wait…'}else if(btn.dataset.t)btn.textContent=btn.dataset.t}
function showMsg(id,text,kind){var el=$(id);if(el){el.innerHTML='<div class="msg '+(kind||'ok')+'">'+esc(text)+'</div>';el.scrollIntoView({block:'center'})}}
function chip(st){var c=String(st||'').split(' ')[0];return '<span class="chip c-'+esc(c)+'">'+esc(st)+'</span>'}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>').replace(/(\+?\d[\d ]{7,}\d)/g,function(m){return '<a href="tel:'+m.replace(/\s/g,'')+'">'+m+'</a>'}).replace(/\n/g,'<br>')}
function openPerson(id){if(S.people)go(personView,id);else loadPeople().then(function(){go(personView,id)})}
function pchip(st){var L={Pending:'Signed up',Reported:'Payment sent',Registered:'Registered',Paid:'Paid in full',Free:'Free'};return '<span class="chip c-'+esc(st)+'">'+esc(L[st]||st)+'</span>'}
function acc(id){return (S.lists.accounts.filter(function(a){return a.id===id})[0])||{name:id,cur:''}}
function sem(id){return (S.lists.seminars.filter(function(s){return s.id===id})[0])||{name:id||''}}
function person(id){return (S.lists.people.filter(function(p){return p.id===id})[0])||null}
function opts(list,sel,valKey,labKey,blank){return (blank?'<option value="">'+esc(blank)+'</option>':'')+list.map(function(x){var v=x[valKey];return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(x[labKey])+'</option>'}).join('')}
function topbar(title,back){return '<div class="top">'+(back!==false||S.stack.length>1?'<button class="back" onclick="goBack()">‹ Back</button>':'')+'<h1 style="flex:1">'+esc(title)+'</h1>'+(S.mode==='team'?'<button class="back" onclick="goHome()" aria-label="Home">🏠</button>':'')+'</div>'}
function go(fn,arg){S.stack.push([fn,arg]);try{history.pushState({sc:S.stack.length},'')}catch(e){}fn(arg)}
function doBack(){S.stack.pop();var p=S.stack[S.stack.length-1];if(p)p[0](p[1]);else{S.stack=[[teamHome]];teamHome()}}
function goBack(){if(history.state&&history.state.sc)history.back();else doBack()}
function goHome(){S.stack=[[teamHome]];teamHome()}
window.addEventListener('popstate',function(){if(S.mode==='team')doBack();else if(S.mode==='participant')partHome()});
function phone254(p){var d=String(p||'').replace(/\D/g,'');if(d.indexOf('0')===0)d='254'+d.slice(1);if(d.length===9)d='254'+d;return d}

/* ---------- start ---------- */
(function start(){
  window.TEST=!!PARAMS.test;
  if(TEST)document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;top:8px;right:8px;z-index:99;background:#b5523b;color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px">TEST VIEW</div>');
  if(PARAMS.t&&!TEST){store('sc_t',PARAMS.t)}
  if(PARAMS.p&&!TEST){store('sc_p',PARAMS.p)}
  if(PARAMS.signup){AUTH={}}
  else if(PARAMS.t){AUTH={t:PARAMS.t}}
  else if(PARAMS.p){AUTH={p:PARAMS.p}}
  else if(store('sc_t')){AUTH={t:store('sc_t')}}
  else if(store('sc_p')){AUTH={p:store('sc_p')}}
  var CK=AUTH.t?'sc_c_'+AUTH.t:'',cached=null;
  try{cached=CK?JSON.parse(store(CK)||'null'):null}catch(e){}
  if(cached&&cached.mode==='team'){applyInit(cached);try{S.people=JSON.parse(store('sc_pp_'+AUTH.t)||'null')}catch(e){}}
  call('init',AUTH).then(function(r){
    if(CK&&r.mode==='team')store(CK,JSON.stringify(r));
    applyInit(r,!!cached);
  }).catch(function(e){
    if(cached&&/internet/i.test(String(e)))return;
    if(!window.TEST){if(AUTH.t)store('sc_t',null);if(AUTH.p)store('sc_p',null);if(CK)store(CK,null)}

function applyInit(r,refresh){

    if(!refresh){S.stack=[[teamHome]];teamHome()}else if(S.stack.length===1&&S.stack[0][0]===teamHome)teamHome();
    if(refresh||!S.people)loadPeople();}
  else if(r.mode==='participant'){S.pv=r.view;S.info=r.info;S.payTo=r.payTo;S.contact=r.contact;S.arrival=r.arrival;S.thanks=r.thanks;partHome()}

function loadPeople(){
  if(S.peopleP)return S.peopleP;

    .catch(function(e){S.peopleP=null;if($('p_out')&&!S.people)$('p_out').innerHTML='<div class="msg err">'+esc(e)+'</div>'});

    '<div class="meta">'+esc(fmtRange(s.start,s.end))+(s.venue?' · '+esc(s.venue):'')+'</div>'+
    (s.price?'<div class="meta">'+money(s.price-(s.deposit||0))+' + '+money(s.deposit||0)+' registration · 3 nights, full board</div>':'')+
    (s.desc?'<a href="#" class="readmore" onclick="event.stopPropagation();toggleMore(\''+esc(s.id)+'\');return false">Read more ›</a><div class="more">'+paras(s.desc)+'</div>':'')+
    '</div>'}).join('');
  h+='<div class="card"><h3>About you</h3>'+

  '<label>Phone number</label><input id="s_phone" type="tel" placeholder="07…"><div class="hint">A member of our team will contact you before the retreat so we can pray for you specifically.</div>'+
  '<label>Gender</label><div class="seg" id="s_g"><button data-v="F" onclick="segPick(this)">Female</button><button data-v="M" onclick="segPick(this)">Male</button></div>'+

  '<div class="card"><h3>Room &amp; board</h3><div class="sub">Rooms and meals are provided during the retreat. Every participant has their own single room.</div>'+
  '<label>Do you have any dietary needs?</label><input id="s_diet" placeholder="e.g. vegetarian, allergies">'+
  '<label>Photos: we would like to take some photos to share what Soul Care does, in newsletters, on our website and in church presentations. Do you agree to appear in these photos?</label>'+
  '<div class="opts" id="s_photo"><button data-v="Agree" onclick="segPick(this)">Yes, I agree</button><button data-v="Disagree" onclick="segPick(this)">No, please do not show me in photos</button></div></div>'+
  '<div class="card"><h3>Personal</h3>'+ta('s_journey','How would you describe where you are at the moment in your journey with God?')+ta('s_hope','What do you hope for from this retreat?')+ta('s_prayer','Is there anything specific we can pray for in the coming weeks?')+'</div>'+
  '<div class="card"><h3>Your cost</h3><div id="s_cost"></div>'+
  '<label class="chk" style="display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-weight:600"><input type="checkbox" id="s_burs" style="width:22px;height:22px;flex:none;margin-top:2px" onchange="$(\'s_bursw\').className=this.checked?\'\':\'hide\'"> 💛 I would like to apply for financial support</label>'+

  '<label>Already paid? Copy the whole M-Pesa confirmation SMS and paste it here</label><textarea id="s_sms" style="min-height:110px" placeholder="TJ1FX66L6H Confirmed. Ksh2,000.00 sent to SOUL CARE RETREAT on 21/10/26 at 3:15 PM…" oninput="smsFill(\'s\')"></textarea><div id="s_smsinfo" class="hint"></div>'+
  '<div class="hint">Please paste the complete message, not just the code. If someone else paid for you, paste the confirmation message they received.</div>'+

  '<div id="s_msg"></div><button class="btn" onclick="doSignup(this)">Register</button>'+
  (S.contact?'<div class="hint" style="text-align:center;margin-top:14px">'+esc(S.contact)+'</div>':'');

function pickRetreat(id){var i=S.selA.indexOf(id);if(i>=0){if(S.selA.length>1)S.selA.splice(i,1)}else S.selA.push(id);

function payTo(){return payName()+(S.pay&&S.pay.phone?', '+S.pay.phone:'')}

  var tot=0,dep=0;var rows=sel.map(function(s){tot+=s.price||0;dep+=s.deposit||0;return '<div class="frow"><span>'+esc(rtParts(s.name).nm)+'</span><b>'+money(s.price)+'</b></div>'}).join('');

function toggleMore(id){var el=$('rt_'+id);el.classList.toggle('open');el.querySelector('.readmore').textContent=el.classList.contains('open')?'Show less ‹':'Read more ›'}
function fmtRange(a,b){var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];function f(x){var p=String(x).split('-');return p.length===3?(+p[2])+' '+m[+p[1]-1]+' '+p[0]:x}return a?(b?f(a)+' – '+f(b):f(a)):''}
function segPick(b){[].forEach.call(b.parentNode.children,function(x){x.classList.remove('on')});b.classList.add('on');b.parentNode.dataset.v=b.dataset.v}
function doSignup(btn){
  var d={seminar:S.selA[0],seminars:S.selA,bursary:$('s_burs').checked,bursaryNote:$('s_bursn').value,name:$('s_name').value,phone:$('s_phone').value,gender:$('s_g').dataset.v||'',age:$('s_age').value,nationality:$('s_nat').value,

function partItems(){var v=S.pv;return (v.items&&v.items.length)?v.items:[{person:v.person,seminar:v.seminar}]}
function myLink(){return location.origin+location.pathname+'?p='+AUTH.p}
function linkCard(){var l=myLink();
  return '<div class="card"><h3>🔗 Your personal page</h3><div class="sub">Save this link so you can come back any time to see your registration and payments.</div>'+
  '<div style="word-break:break-all;margin:8px 0;padding:10px;background:var(--brand2);border-radius:10px;font-size:14px">'+esc(l)+'</div>'+
  '<div class="grid" style="margin:6px 0 0"><button class="big" onclick="copyLink(this)"><span class="i">📋</span>Copy link</button><a class="big" style="text-decoration:none;color:inherit;display:block" target="_blank" href="https://wa.me/?text='+encodeURIComponent('My Soul Care retreat page: '+l)+'"><span class="i">💬</span>Send to myself on WhatsApp</a></div>'+
  '<div class="hint">Tip: in your browser menu choose “Add to Home screen” – then it opens like an app.</div></div>'}
function copyLink(b){var l=myLink();function ok(){b.innerHTML='<span class="i">✓</span>Copied'}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(l).then(ok,function(){prompt('Copy this link:',l)});else prompt('Copy this link:',l)}
function partHome(note){
  var v=S.pv,its=partItems(),p=its[0].person;
  var pays=v.payments.map(function(x){var nm=its.length>1?(its.filter(function(i){return i.person.ID===x.pid})[0]||{seminar:{}}).seminar:null;

  if(just)h+=linkCard();
  h+='<h1>Hello '+esc(String(p.Name).split(' ')[0])+'</h1>'+(note?'<div class="msg ok">'+esc(note)+'</div>':'')+topStatusAll(its);
  h+=its.map(function(it){var sm=it.seminar,rp=rtParts(sm.name);
    return '<div class="card"><div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">'+esc(rp.lbl||'Retreat')+'</div><div style="font-family:Sacramento,cursive;font-size:40px;line-height:1.15;color:var(--brand)">'+esc(rp.nm)+'</div>'+

    (sm.desc?'<div id="rt_me_'+esc(sm.id)+'" class="rtd">'+paras(sm.desc)+'</div><div class="hint"><a href="#" onclick="var d=$(\'rt_me_'+esc(sm.id)+'\');d.classList.toggle(\'open\');this.textContent=d.classList.contains(\'open\')?\'Show less\':\'Read more\';return false">Read more</a></div>':'')+'</div>'}).join('');
  h+=(S.arrival?'<div class="card"><h3>Arrival</h3><p>'+linkify(S.arrival)+'</p></div>':'')+

  /* payment */

    tot+=due;paid+=pc;rep+=pr;open+=Math.max(0,due-pc);need+=Math.max(0,Math.min(Number(it.seminar.deposit)||0,due)-pc-pr);
    if(q['Financial support'])burs.push({st:q['Financial support'],amt:Number(q.Discount)||0,nm:rtParts(it.seminar.name).nm})});
  h+='<div class="paysec" id="paysec"><h2>Payment</h2>';
  if(its.length>1)h+='<div class="card">'+its.map(function(it){return '<div class="frow"><span>'+esc(rtParts(it.seminar.name).nm)+'</span><b>'+money(it.person.Due)+'</b></div>'}).join('')+'<div class="frow tot"><span>Total</span><b>'+money(tot)+'</b></div></div>';
  h+='<div class="stat"><div><b>'+money(tot)+'</b><span>Total</span></div><div><b class="pos">'+money(paid)+'</b><span>Received</span></div><div><b class="'+(open>0?'neg':'pos')+'">'+money(open)+'</b><span>Still open</span></div></div>';
  if(rep>0)h+='<div class="hint">Payments being checked: '+money(rep)+'. They show as received once the team has confirmed them.</div>';
  var bs={};burs=burs.filter(function(b){var k=b.st+'|'+b.amt;if(bs[k]){bs[k].nm+=' & '+b.nm;return false}bs[k]=b;return true});
  burs.forEach(function(b){h+=b.st==='Approved'?'<div class="msg ok">💛 Financial support of <b>'+money(b.amt)+'</b> has been approved for you'+(its.length>1?' ('+esc(b.nm)+')':'')+'. It is already taken off your total above.</div>':
    b.st==='Requested'?'<div class="msg info">💛 Your request for financial support has been received'+(its.length>1?' ('+esc(b.nm)+')':'')+'. The team will let you know here.</div>':
    b.st==='Not approved'?'<div class="msg info">💛 We were not able to give financial support this time'+(its.length>1?' ('+esc(b.nm)+')':'')+'. Please contact Lisa or Kristen if you would like to talk about it.</div>':''});
  var rest=Math.max(0,open-rep);

  else if(rest>0)h+='<div class="msg info">The remaining <b>'+money(rest)+'</b> can be paid in parts before the retreat, by M-Pesa (“Send money”) to <b>'+esc(payTo())+'</b>.'+copyBtns(0)+'</div>';
  h+='<button class="btn'+(need>0?'':' light')+'" onclick="partReport()">I made a payment – paste the M-Pesa SMS</button>';
  if(!burs.length&&open>0)h+='<button class="btn light" onclick="partBursary()">💛 Apply for financial support</button>';
  h+='<div class="card"><h3>My payments</h3><div class="list">'+(pays||'<div class="sub">No payments yet.</div>')+'</div></div></div>';
  if(!just)h+=linkCard();

function partBursarySend(btn){busy(btn,true);call('participantBursary',AUTH,{note:$('b_note').value}).then(function(r){S.pv=r.view;partHome('Thank you – your request has been sent.')}).catch(function(e){busy(btn,false);showMsg('b_msg',e,'err')})}

function teamHome(){

function whatIfCard(d){
  if(!S.wi)S.wi={avg:5000,n:{}};
  return '<div class="card" style="border:2px solid var(--brand)"><h3>🧮 What if…</h3><div class="sub">Try out numbers – nothing is saved.</div>'+
  '<label>On average, a participant pays (KES)</label><div style="display:flex;gap:8px;align-items:center"><input id="wi_avg" type="range" min="0" max="'+(d.sems[0]?d.sems[0].price:19000)+'" step="500" value="'+S.wi.avg+'" oninput="S.wi.avg=+this.value;$(\'wi_avgn\').value=this.value;wiCalc()" style="flex:2"><input id="wi_avgn" type="number" inputmode="numeric" value="'+S.wi.avg+'" style="flex:1;margin:0" oninput="S.wi.avg=+this.value||0;$(\'wi_avg\').value=S.wi.avg;wiCalc()"></div>'+
  d.sems.map(function(s){var v=S.wi.n[s.id]!=null?S.wi.n[s.id]:s.n;return '<label>Participants at '+esc(rtParts(s.name).nm)+' <span class="sub">(+ '+s.team+' team)</span></label><input type="number" inputmode="numeric" value="'+v+'" oninput="S.wi.n[\''+s.id+'\']=Math.max(0,+this.value||0);wiCalc()">'}).join('')+
  '<div id="wi_out" style="margin-top:12px"></div></div>'}
function wiCalc(){var d=S.home.budget,el=$('wi_out');if(!el)return;var nk=window.NOKES;window.NOKES=true;
  var acc=(d.cats.filter(function(c){return /accommodation/i.test(c.name)})[0]||{rows:[]}).rows;
  var venueNow=0,venueNew=0,feesIn=0,people=0,costPP=0;
  d.sems.forEach(function(s){var r=acc.filter(function(x){return x.seminar===s.id})[0]||{planned:0,auto:0,spent:0};
    var n=S.wi.n[s.id]!=null?S.wi.n[s.id]:s.n;people+=n;costPP=s.costP;
    venueNow+=Math.max(0,r.planned-r.spent);
    venueNew+=Math.max(0,(n*s.costP+s.team*s.costT)+(r.planned-r.auto)-r.spent);
    feesIn+=Math.max(0,n*S.wi.avg-s.received)});
  var other=d.stillPlanned-d.discounts-venueNow;
  var costs=other+venueNew,have=d.available+feesIn,res=have-costs;
  var fixed=costs-d.available+d.sems.reduce(function(a,s){return a+s.received},0);
  var be=people?Math.ceil(fixed/people/500)*500:0;
  var perHead=costPP-S.wi.avg;var more=perHead>0?Math.floor(Math.abs(res)/perHead):0;
  var x=frow('','Money available now',d.available)+frow('+','Participants pay ('+people+' × '+money(S.wi.avg)+')',feesIn)+
    frow('−','Venue ('+people+' participants + team)',venueNew)+frow('−','All other planned costs',other)+
    frow('=',res>=0?'Surplus':'Deficit',res,'tot');
  x+=res>=0?'<div class="msg ok">✓ This works. '+(perHead>0?'You could invite about <b>'+more+' more</b> participants at this average.':'')+'</div>'
    :'<div class="msg err">Short by <b>'+money(-res)+'</b>. '+(perHead>0?'That is about <b>'+more+' participants too many</b> at this average – or raise '+money(-res)+' more.':'')+'</div>';
  x+='<div class="hint">To break even with '+people+' participants, each would need to pay about <b>'+money(Math.max(0,be))+'</b> on average. Each participant costs '+money(costPP)+' at the venue.</div>';
  el.innerHTML=x;window.NOKES=nk}

  if(f==='unassigned'){$('t_out').innerHTML='<div class="hint">Choose a person for each task – it saves right away and moves to their list.</div><div class="card"><div class="list">'+(l.map(function(t){return '<div class="it" style="display:block"><div class="t tap" onclick="go(taskEdit,{id:\''+t.id+'\'})">'+esc(t.title)+'</div><div class="sub">'+(t.due?'due '+esc(t.due):'')+(t.description?' · '+esc(t.description):'')+'</div><select style="margin-top:6px" onchange="taskAssign(\''+t.id+'\',this)">'+teamOpts('')+'</select><span class="hint"></span></div>'}).join('')||'<div class="sub">✓ All tasks are assigned.</div>')+'</div></div>';return}
  $('t_out').innerHTML='<div class="card"><div class="list">'+(l.map(function(t){var done=t.status==='Done';
    return '<div class="it"><div class="l tap" onclick="go(taskEdit,{id:\''+t.id+'\'})"><div class="t" style="'+(done?'text-decoration:line-through;color:var(--mute)':'')+'">'+esc(t.title)+'</div><div class="sub">'+esc(t.responsible||'Not assigned yet')+(t.due?' · <span class="'+(!done&&t.due<today()?'neg':'')+'">due '+esc(t.due)+'</span>':'')+'</div></div>'+
    '<div class="r"><button class="btn small '+(done?'light':'')+'" style="width:auto" onclick="taskToggle(\''+t.id+'\',this)">'+(done?'↺ Reopen':'✓ Done')+'</button></div></div>'}).join('')||'<div class="sub">No tasks here.</div>')+'</div></div>'}
function taskToggle(id,btn){var t=S.tasks.filter(function(x){return x.id===id})[0];busy(btn,true);
  call('taskStatus',AUTH,id,t.status==='Done'?'To do':'Done').then(function(l){S.tasks=l;S.home.myTasks=l.filter(function(x){return x.responsible===S.me&&x.status!=='Done'});if($('t_out'))tasksRender();else if($('tk_msg'))goBack()}).catch(function(e){busy(btn,false);alert(e)})}
function taskEdit(o){var t={title:'',description:'',due:'',responsible:S.me,status:'To do',createdBy:S.me};
  if(o.id){var f=(S.tasks||[]).concat(S.home.myTasks||[]).filter(function(x){return x.id===o.id})[0];if(f)t=f}
  var canDel=o.id&&(t.createdBy===S.me||S.admin);
  render(topbar(o.id?'Task':'New task',true)+(o.id?'<div style="margin:6px 0 10px"><span class="chip '+(t.status==='Done'?'c-Paid':'c-Pending')+'">'+(t.status==='Done'?'✓ Done':'To do')+'</span></div>':'')+'<div class="card">'+
  '<label style="margin-top:0">Title</label><input id="tk_t" value="'+esc(t.title)+'" placeholder="e.g. Book the bus for Saturday">'+
  '<label>Who is responsible?</label><select id="tk_r">'+teamOpts(t.responsible)+'</select>'+
  '<label>Due date (optional)</label><input id="tk_d" type="date" value="'+esc(t.due)+'">'+
  '<label>Description (optional)</label><textarea id="tk_x" style="min-height:90px">'+esc(t.description||'')+'</textarea>'+
  (o.id?'<div class="hint">Created by '+esc(t.createdBy||'?')+' · '+(t.status==='Done'?'✓ Done'+(t.doneAt?' on '+esc(t.doneAt):''):'To do')+'</div>':'')+
  '<div id="tk_msg"></div><button class="btn" onclick="taskSaveC(\''+(o.id||'')+'\',this)">Save</button>'+
  (o.id?'<button class="btn light" onclick="taskToggle(\''+o.id+'\',this)">'+(t.status==='Done'?'↺ Mark as not done':'✓ Mark as done')+'</button>':'')+
  (canDel?'<button class="btn red" onclick="taskDel(\''+o.id+'\',this)">Delete task</button>':'')+'</div>')}
function taskSaveC(id,btn){var d={id:id,title:$('tk_t').value,responsible:$('tk_r').value,due:$('tk_d').value,description:$('tk_x').value};busy(btn,true);
  call('taskSave',AUTH,d).then(function(l){S.tasks=l;S.home.myTasks=l.filter(function(x){return x.responsible===S.me&&x.status!=='Done'});
    var who=S.lists.team.filter(function(m){return m.name===d.responsible})[0];
    if(!id&&who&&who.name!==S.me&&who.phone){render(topbar('Task saved',false)+'<div class="msg ok">✓ Task saved for '+esc(who.name)+'.</div><a class="btn" style="text-align:center;text-decoration:none" target="_blank" href="https://wa.me/'+phone254(who.phone)+'?text='+encodeURIComponent('Hi '+who.name.split(' ')[0]+', I added a task for you in the Soul Care app: '+d.title+(d.due?' (due '+d.due+')':''))+'">Let '+esc(who.name.split(' ')[0])+' know on WhatsApp</a><button class="btn light" onclick="goBack()">Back to tasks</button>')}
    else goBack()}).catch(function(e){busy(btn,false);showMsg('tk_msg',e,'err')})}
function taskDel(id,btn){if(!confirm('Delete this task?'))return;busy(btn,true);call('taskDelete',AUTH,id).then(function(l){S.tasks=l;S.home.myTasks=l.filter(function(x){return x.responsible===S.me&&x.status!=='Done'});goBack()}).catch(function(e){busy(btn,false);alert(e)})}
function needsCard(h){
  var sup=h.supportReq||[],t=h.toCheck||[],ua=h.unassigned||0;if(!sup.length&&!t.length&&!ua)return '<div class="card"><h3>🔔 Needs you</h3><div class="sub">✓ Nothing waiting – all clear.</div></div>';
  var x='<div class="card" style="border:2px solid var(--brand)"><h3>🔔 Needs you ('+(sup.length+t.length+(ua?1:0))+')</h3>';
  if(ua)x+='<div class="it tap" onclick="S.tf=\'unassigned\';go(tasksView,{})"><div class="l"><div class="t">📋 '+ua+' task'+(ua>1?'s':'')+' not assigned yet</div><div class="sub">Tap to give each one to a team member</div></div><div class="r">›</div></div>';
  x+=sup.map(function(s){return '<div class="it" style="display:block"><div class="t">💛 '+esc(s.name)+' asks for financial support</div><div class="sub">'+esc(rtParts(sem(s.seminar).name).nm)+(s.note?' · “'+esc(s.note)+'”':'')+'</div>'+
    '<div style="display:flex;gap:6px;align-items:center;margin-top:6px"><input id="ns_'+s.id+'" type="number" inputmode="numeric" value="5000" style="flex:1;margin:0"><button class="btn small" style="width:auto;margin:0" onclick="nySupport(\''+s.id+'\',\'Approved\',this)">Approve</button><button class="btn small light" style="width:auto;margin:0" onclick="nySupport(\''+s.id+'\',\'Not approved\',this)">No</button></div></div>'}).join('');
  x+=t.map(function(p){var unk=p.Status==='Confirmed'&&!p['Participant ID'],why=String(p.Notes||'').split(' | ').filter(function(n){return !/^SMS:/.test(n)}).join(' · ');
    var head='<div class="t">'+(unk?'💳 '+money(p.Amount,p.Currency)+' received from '+esc(p.Party||'?'):'💳 '+esc(p.personName||p.Party||'?')+' – '+money(p.Amount,p.Currency))+'</div><div class="sub">'+esc(p.Date)+' · '+esc(p['M-Pesa code / Ref']||'')+(why?' · '+esc(why):'')+'</div>';
    if(unk)return '<div class="it" style="display:block">'+head+'<div style="display:flex;gap:6px;margin-top:6px"><select id="as_'+p.ID+'" style="flex:1;margin:0">'+peopleOpts('')+'</select><button class="btn small" style="width:auto;margin:0" onclick="nyAssign(\''+p.ID+'\',this)">This is them</button></div><div class="hint"><a href="#" onclick="nyAct(\''+p.ID+'\',\'donation\',this);return false">Not a participant – it was a donation</a></div></div>';
    return '<div class="it" style="display:block">'+head+'<div style="display:flex;gap:6px;margin-top:6px"><button class="btn small" style="width:auto;flex:1;margin:0" onclick="nyAct(\''+p.ID+'\',\'confirm\',this)">✓ OK</button><button class="btn small light" style="width:auto;margin:0" onclick="editTx(\''+p.ID+'\')">Edit</button><button class="btn small red" style="width:auto;margin:0" onclick="if(confirm(\'Remove this payment?\'))nyAct(\''+p.ID+'\',\'delete\',this)">Remove</button></div></div>'}).join('');
  return x+'</div>'}
function nyDone(){return refreshHome().then(function(){S.people=null;loadPeople();if(S.stack.length===1)teamHome()})}
function nyAct(id,a,btn){busy(btn,true);call('teamAction',AUTH,id,a).then(nyDone).catch(function(e){busy(btn,false);alert(e)})}
function nyAssign(id,btn){var v=$('as_'+id).value;if(!v){alert('Please choose who paid.');return}busy(btn,true);call('teamAction',AUTH,id,'assign',v).then(nyDone).catch(function(e){busy(btn,false);alert(e)})}
function nySupport(id,dec,btn){busy(btn,true);call('teamBursary',AUTH,id,dec,dec==='Approved'?$('ns_'+id).value:0).then(function(l){S.people=l;return nyDone()}).catch(function(e){busy(btn,false);alert(e)})}
function remindView(){render(topbar('Payment reminders',true)+'<div id="rm_out">'+(S.people?'':'<div class="loading">Loading…</div>')+'</div>');if(S.people)remindRender();loadPeople().then(function(){if($('rm_out'))remindRender()})}
function remindRender(){
  var pay=payName()+(S.pay&&S.pay.phone?', '+S.pay.phone:'');
  var fee=[],bal=[];S.people.forEach(function(p){var s=sem(p.Seminar),due=Number(p.Due)||0,paid=(Number(p['Paid (confirmed)'])||0)+(Number(p['Paid (reported)'])||0),need=Math.max(0,Math.min(s.deposit||0,due)-paid),open=Math.max(0,due-paid);
    if(need>0)fee.push({p:p,amt:need});else if(open>0)bal.push({p:p,amt:open})});
  function row(r,kind){var p=r.p,first=String(p.Name).split(' ')[0],nm=rtParts(sem(p.Seminar).name).nm;
    var msg=kind==='fee'?'Hello '+first+', thank you for signing up for the Soul Care retreat “'+nm+'”! Your place is secured once the registration fee of '+money(r.amt)+' is paid. Please send it by M-Pesa (Send money) to '+pay+'. Your personal page: '+p.link+' – Blessings, '+S.me
      :'Hello '+first+', we are looking forward to seeing you at the Soul Care retreat “'+nm+'”. '+money(r.amt)+' is still open – you can pay it in parts by M-Pesa (Send money) to '+pay+'. Your personal page: '+p.link+' – Blessings, '+S.me;
    return '<div class="it"><div class="l"><div class="t">'+esc(p.Name)+'</div><div class="sub">'+esc(nm)+' · '+money(r.amt)+'</div></div><div class="r">'+(p.Phone?'<a class="btn small" style="text-decoration:none;width:auto;display:inline-block;margin:0" target="_blank" href="https://wa.me/'+phone254(p.Phone)+'?text='+encodeURIComponent(msg)+'">💬 Remind</a>':'<span class="sub">no phone</span>')+'</div></div>'}
  $('rm_out').innerHTML='<div class="hint">Tap 💬 – WhatsApp opens with a friendly message ready. Just press send.</div>'+
  '<div class="card"><h3>Registration fee not paid yet ('+fee.length+')</h3><div class="list">'+(fee.map(function(r){return row(r,'fee')}).join('')||'<div class="sub">Nobody – great!</div>')+'</div></div>'+
  '<div class="card"><h3>Registered, still owe money ('+bal.length+')</h3><div class="list">'+(bal.map(function(r){return row(r,'bal')}).join('')||'<div class="sub">Nobody.</div>')+'</div></div>'}
function copyText(t,btn){function ok(){var o=btn.textContent;btn.textContent='✓ Copied';setTimeout(function(){btn.textContent=o},1500)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(String(t)).then(ok,function(){prompt('Copy:',t)});else prompt('Copy:',t)}
function copyBtns(amt){var ph=(S.pay&&S.pay.phone)||'';return '<div style="display:flex;gap:6px;margin-top:8px">'+(ph?'<button class="btn small light" style="width:auto;flex:1;margin:0" onclick="copyText(\''+esc(ph)+'\',this)">📋 Copy number</button>':'')+(amt?'<button class="btn small light" style="width:auto;flex:1;margin:0" onclick="copyText(\''+Math.round(amt)+'\',this)">📋 Copy amount</button>':'')+'</div>'}
function upcomingSem(){var t=today(),l=S.lists.seminars.filter(function(s){return s.id!=='GEN'&&s.start&&s.start>=t}).sort(function(a,b){return a.start<b.start?-1:1});return l[0]?l[0].id:'GEN'}
function rememberFill(){var p=($('f_party').value||'').trim().toLowerCase();if(!p||!S.txHist)return false;var w=p.split(' ')[0];
  var hit=S.txHist.filter(function(t){var q=String(t.Party||'').toLowerCase();return q===p||(w.length>3&&q.split(' ')[0]===w)})[0];
  if(hit){if(!$('f_cat').value&&hit.Category)$('f_cat').value=hit.Category;if(S.form.semAuto&&hit.Seminar){$('f_sem').value=hit.Seminar;S.form.semAuto=false}return true}return false}
function newsEdit(){
  render(topbar('Team news',true)+'<div class="card"><div class="sub">Shown at the top of every team member\'s app. Links and phone numbers become tappable.</div><textarea id="n_txt" style="min-height:160px" placeholder="Next team meeting: Tuesday 4 Nov, 7 pm&#10;Zoom: https://…">'+esc(S.home.news||'')+'</textarea><div id="n_msg"></div><button class="btn" onclick="newsSave(this)">Save</button></div>');
}
function newsSave(btn){var t=$('n_txt').value;busy(btn,true);call('teamSetNews',AUTH,t).then(function(){S.home.news=t;S.stack=[[teamHome]];teamHome()}).catch(function(e){busy(btn,false);showMsg('n_msg',e,'err')})}
function boardView(o){o=o||{};var sems=S.lists.seminars.filter(function(s){return s.id!=='GEN'});
  render(topbar('Prayer groups',true)+'<select id="b_sem" onchange="boardRender()">'+opts(sems,o.seminar||(sems[0]||{}).id,'id','name')+'</select>'+
  '<div class="hint">Press and hold a name, then drag it into another group. Or tap a name, then tap the group. It saves right away. Only team members who are part of this retreat are shown (set that under Team → Edit).</div>'+
  '<div id="b_out">'+(S.people?'':'<div class="loading">Loading…</div>')+'</div>');
  if(S.people)boardRender();loadPeople();
}
function boardRender(){
  if(!S.people||!$('b_out'))return;var sm=$('b_sem').value;S.selCard=null;
  S.stack[S.stack.length-1]=[boardView,{seminar:sm}];
  var team=S.lists.team.filter(function(m){return m.active&&(!m.seminars||!m.seminars.length||m.seminars.indexOf(sm)>=0)});
  var ppl=S.people.filter(function(p){return p.Seminar===sm});
  var cols=[{name:'',title:'Not assigned yet'}].concat(team.map(function(m){return {name:m.name,title:m.name}}));
  ppl.forEach(function(p){var n=p['Prayer partner'];if(n&&!cols.some(function(c){return c.name===n}))cols.push({name:n,title:n})});
  $('b_out').innerHTML='<div class="board">'+cols.map(function(c){var l=ppl.filter(function(p){return (p['Prayer partner']||'')===c.name});
    return '<div class="grp'+(c.name?'':' un')+'" data-name="'+esc(c.name)+'" onclick="boardTapGroup(this)"><div class="gh"><b>'+esc(c.title)+'</b><span class="gc">'+l.length+'</span></div><div class="gl" data-name="'+esc(c.name)+'">'+
      l.map(function(p){return '<div class="pc" data-id="'+p.ID+'" onclick="boardTapCard(event,this)">'+esc(p.Name)+(isReg(p)?'':'<div class="sub">signed up, not paid</div>')+'</div>'}).join('')+'</div></div>'}).join('')+'</div>';
  if(window.Sortable)[].forEach.call(document.querySelectorAll('.gl'),function(el){new Sortable(el,{group:'pg',animation:150,delay:180,delayOnTouchOnly:true,
    onStart:function(){S.dragging=true},onEnd:function(ev){S.dragging=false;if(ev.from!==ev.to)movePartner(ev.item.dataset.id,ev.to.dataset.name)}})});
}
function boardTapCard(e,el){e.stopPropagation();[].forEach.call(document.querySelectorAll('.pc.sel'),function(x){x.classList.remove('sel')});
  var on=S.selCard!==el.dataset.id;S.selCard=on?el.dataset.id:null;if(on)el.classList.add('sel');
  [].forEach.call(document.querySelectorAll('.grp'),function(g){g.classList.toggle('target',on)})}
function boardTapGroup(g){if(!S.selCard)return;var id=S.selCard,p=S.people.filter(function(x){return x.ID===id})[0];if(p&&(p['Prayer partner']||'')!==g.dataset.name)movePartner(id,g.dataset.name);else boardRender()}
function movePartner(id,name){
  S.people.forEach(function(p){if(p.ID===id)p['Prayer partner']=name});boardRender();
  call('teamSetPartner',AUTH,id,name).then(function(){try{store('sc_pp_'+AUTH.t,JSON.stringify(S.people))}catch(e){}})
  .catch(function(e){alert('Could not save: '+e);S.people=null;loadPeople()});
}
function balRow(b){

  if(!confirm('Count the amount owed as a private donation? It will no longer be paid back.'))return;

  else if(x.dir==='out'){$('f_from').value='KE-PHONE';$('f_to').value='OUT-VENDOR';$('f_party').value=x.party||'';txUpdate();msg='Paid '+money(x.amount)+' to '+(x.party||'?')+(rememberFill()?' – filled in like last time, please check.':' – please choose what it was for.')}

function getRate(a,b){var k=a+b;if(RATES[k])return Promise.resolve(RATES[k]);return fetch('https://open.er-api.com/v6/latest/'+a).then(function(r){return r.json()}).then(function(j){var v=j&&j.rates&&j.rates[b];if(v)RATES[k]=v;return v}).catch(function(){return null})}

function smsView(){

  '<textarea id="m_txt" style="min-height:160px" placeholder="TJ1FX66L6H Confirmed. You have received Ksh2,000.00 from …"></textarea>'+
  '<button class="btn" onclick="smsParse()">Read messages</button><div id="m_out"></div></div>');
}
function parseSms(text){
  var parts=String(text).split(/(?=\b[A-Z0-9]{10}\s+Confirmed)/);
  return parts.map(function(s){
    var m=s.match(/\b([A-Z0-9]{10})\s+Confirmed/);if(!m)return null;
    var o={code:m[1]};
    var a=s.match(/Ksh\s?([\d,]+(?:\.\d{1,2})?)/i);o.amount=a?Number(a[1].replace(/,/g,'')):0;
    var d=s.match(/on\s+(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(d){var y=d[3].length===2?'20'+d[3]:d[3];o.date=y+'-'+('0'+d[2]).slice(-2)+'-'+('0'+d[1]).slice(-2)}
    var tm=s.match(/at\s+(\d{1,2}:\d{2}\s*[AP]M)/i);if(tm)o.time=tm[1];
    var c=s.match(/Transaction cost,?\s*Ksh\s?([\d,]+(?:\.\d{1,2})?)/i);o.fee=c?Number(c[1].replace(/,/g,'')):0;
    var b=s.match(/balance is\s*Ksh\s?([\d,]+(?:\.\d{1,2})?)/i);o.balance=b?Number(b[1].replace(/,/g,'')):null;
    var r;
    if(/you have received/i.test(s)){o.dir='in';r=s.match(/from\s+(.+?)\s+on\s+\d{1,2}\//i);
      if(r){var who=r[1];var ph=who.match(/(\+?\d[\d*]{6,})\s*$/);if(ph){o.phone=ph[1];who=who.slice(0,ph.index)}o.party=who.replace(/[.\s]+$/,'').trim()}}
    else if(/withdraw/i.test(s)){o.dir='withdraw';o.party='Cash withdrawal'}
    else if(/sent to/i.test(s)){o.dir='out';r=s.match(/sent to\s+(.+?)\s+on\s+\d{1,2}\//i);if(r)o.party=r[1].replace(/\s+for account.*$/i,'').replace(/\s+\+?\d[\d*]{6,}\s*$/,'').replace(/[.\s]+$/,'').trim()}
    else if(/paid to/i.test(s)){o.dir='out';r=s.match(/paid to\s+(.+?)\s+on\s+\d{1,2}\//i);if(r)o.party=r[1].replace(/[.\s]+$/,'').trim()}
    else o.dir='?';
    return o;
  }).filter(Boolean);
}
function smsParse(){
  var items=parseSms($('m_txt').value);S.sms=items;
  if(!items.length){$('m_out').innerHTML='<div class="msg err">No M-Pesa messages found. Copy the whole SMS including the code at the start.</div>';return}
  var ins=insideAccs().filter(function(a){return a.cur==='KES'});

    '<label>These arrived on</label><select id="m_to">'+opts(ins,'KE-PHONE','id','name')+'</select>'+
    '<div class="hint">They are saved as participant payments. If a participant already reported the code, it gets confirmed automatically. Payers we can\'t recognise go to "To check".</div>'+
    '<button class="btn" onclick="smsSave(this)">Save '+rec.length+' received payment'+(rec.length>1?'s':'')+'</button>'}
  if(out.length){h+='<h3>Money sent / paid ('+out.length+')</h3><div class="hint">Tap each one to add what it was for.</div><div class="list">'+out.map(function(x,i){return '<div class="it tap" onclick="smsOut('+items.indexOf(x)+')"><div class="l"><div class="t">'+esc(x.party||'?')+'</div><div class="sub">'+esc(x.code)+' · '+esc(x.date||'')+(x.fee?' · fee '+x.fee:'')+'</div></div><div class="r">'+money(x.amount)+' ›</div></div>'}).join('')+'</div>'}
  $('m_out').innerHTML=h;
}

    return '<div class="card"><div class="it" style="border:0;padding:0"><div class="l"><div class="t">'+esc(p.name)+'</div><div class="sub">'+esc(rtParts(p.seminar).nm)+(p.age?' · age '+esc(p.age):'')+'</div></div><div class="r">'+chip(st)+'</div></div>'+
    (p.phone?'<div style="margin:8px 0"><a href="tel:'+esc(p.phone)+'">📞 '+esc(p.phone)+'</a>'+(wa?' · <a target="_blank" href="'+esc(wa)+'">WhatsApp</a>':'')+'</div>':'')+
    [['journey','Journey with God'],['hope','Hope for the retreat'],['prayer','Prayer requests'],['diet','Dietary needs']].filter(function(x){return p[x[0]]}).map(function(x){return '<div style="margin:6px 0"><div class="sub">'+x[1]+'</div><div>'+esc(p[x[0]])+'</div></div>'}).join('')+'</div>'}).join(''):'<div class="card">No one has been assigned to you yet. The team will let you know.</div>';
  h+='<div class="hint" style="text-align:center;margin-top:16px"><a href="#" onclick="call(\'partnerHome\',AUTH).then(function(r){S.group=r.group;partnerHome()});return false">↻ Refresh</a></div>';
  render(h);
}
function regBanner(p,sm){var st=p.Status,rep=Number(p['Paid (reported)'])||0;
  if(st==='Paid')return '<div class="msg ok">✓ <b>Fully paid.</b> Your place is secured. We look forward to seeing you!</div>';
  if(st==='Registered'||st==='Free')return '<div class="msg ok">✓ <b>Registered.</b> Your place is secured.'+(p.Balance>0?' The remaining '+money(p.Balance)+' can be paid in parts before the retreat.':'')+'</div>'+(rep>0?'<div class="msg info">'+money(rep)+' reported by you, waiting for the team to confirm.</div>':'');
  if(rep>0)return '<div class="msg info"><b>Payment being checked.</b> We have your payment of '+money(rep)+'. Your registration will be confirmed as soon as the team has checked it.</div>';
  return '<div class="msg err"><b>Registration pending.</b> Your place is only secured once the registration fee of '+money(sm.deposit||2000)+' has been paid. Send it by M-Pesa ("Send money") to '+esc(payName()+(S.pay&&S.pay.phone?', '+S.pay.phone:''))+', then tap the button below and paste the confirmation SMS. If someone else paid for you, paste the message they received.</div>'}
function answers(p){var q=[['Age','Age'],['Nationality','Nationality'],['Dietary needs','Dietary needs'],['Photo consent','Photos'],['Journey with God','Journey with God'],['Hope for retreat','Hope for the retreat'],['Prayer requests','Prayer requests'],['Notes','Notes']].filter(function(x){return p[x[0]]!==''&&p[x[0]]!=null});
  return q.length?'<div class="card"><h3>Registration answers</h3>'+q.map(function(x){return '<div style="margin:8px 0"><div class="sub">'+esc(x[1])+'</div><div>'+esc(p[x[0]])+'</div></div>'}).join('')+'</div>':''}
</script>
